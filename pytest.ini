[pytest]
# Collect only the real test suite by default.
#
# Without this, `pytest` from the repository root walks the whole tree and
# picks up any stray `test_*.py` that lives outside `tests/`. Two files with
# the same basename in different directories (neither package having an
# `__init__.py`) then collide in pytest's prepend import mode:
#
#   import file mismatch:
#   imported module 'test_kie' has this __file__ attribute: .../scripts/test_kie.py
#   which is not the same as the test file we want to collect: .../test_kie.py
#
# which aborts collection with zero tests run and a non-zero exit — while
# `pytest tests/` passes, so the breakage is invisible unless CI runs the
# default invocation.
testpaths = tests

# `scripts/` holds live smoke harnesses (scripts/test_kie.py hits the paid
# KIE API). They are run manually, never as part of the suite.
norecursedirs = scripts .git .venv node_modules library serials summary openspec
